name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["chsl_tutor/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" || true

      - name: Get llama.cpp
        run: |
          rm -rf llama.cpp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp
          git -C llama.cpp log -1 --format='llama.cpp %h %cd'

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir -p logout && cp build.log logout/ 2>/dev/null || echo "no build.log" > logout/build.log
          cd logout
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b build-log
          git add -A
          git commit -q -m "build log ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-log

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/GGUF-Lab-CHSL-Coach.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: GGUF-Lab-APK
          path: out/GGUF-Lab-CHSL-Coach.apk

      - name: Publish APK to the 'apk' branch
        run: |
          cd out
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b apk
          git add GGUF-Lab-CHSL-Coach.apk
          git commit -q -m "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
