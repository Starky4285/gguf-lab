name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["chsl_tutor/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Get llama.cpp
        run: |
          rm -rf llama.cpp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp
          git -C llama.cpp log -1 --format='llama.cpp %h %cd'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/GGUF-Lab-CHSL-Coach.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: GGUF-Lab-APK
          path: out/GGUF-Lab-CHSL-Coach.apk

      - name: Publish APK to the 'apk' branch
        run: |
          cd out
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b apk
          git add GGUF-Lab-CHSL-Coach.apk
          git commit -q -m "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
